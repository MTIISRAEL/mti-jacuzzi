<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e7c">
<title>מעקב ג'קוזי MTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css?v=20261111-094012">
</head>
<body>

<div class="wrap" id="loginView" hidden>
  <div class="login">
    <h1>מעקב ג'קוזי MTI</h1>
    <p>אשדוד ⇄ ברקן · מבקשת אספקה ועד הלקוח</p>
    <button class="btn primary big" id="loginBtn" type="button">כניסה עם חשבון Google</button>
    <p class="err" id="loginErr"></p>
  </div>
</div>

<div class="wrap" id="noAccessView" hidden>
  <div class="login">
    <h1>אין עדיין הרשאה</h1>
    <p>החשבון <strong id="noAccessEmail" dir="ltr"></strong> לא מוגדר במערכת. צריך לבקש ממאיר להוסיף אותו.</p>
    <button class="btn" id="logoutBtn2" type="button">יציאה והחלפת חשבון</button>
  </div>
</div>

<div class="wrap" id="appView" hidden>
  <div class="head">
    <div><h1 class="kinds" role="tablist" aria-label="מה עוקבים"><button class="kind on" type="button" role="tab" aria-selected="true" data-kind="jacuzzi">מעקב ג'קוזי</button><button class="kind" type="button" role="tab" aria-selected="false" data-kind="spa">מעקב ספא</button></h1><div class="sub" id="whoami"></div></div>
    <div class="row">
      <button class="btn primary" id="newBtn" type="button" hidden>+ הזמנה חדשה</button>
      <button class="btn small" id="usersBtn" type="button" hidden>משתמשים</button>
      <button class="btn small" id="logoutBtn" type="button">יציאה</button>
    </div>
  </div>

  <div class="banner" id="updateBar" hidden>יש גרסה חדשה של המערכת. <button class="btn small" type="button" onclick="location.replace(location.pathname + '?r=' + Date.now())">רענון עכשיו</button></div>
  <div class="banner" id="banner" hidden></div>
  <div class="form" id="form" hidden></div>
  <div class="form" id="usersPanel" hidden></div>

  <div class="tiles" id="tiles"></div>
  <div class="board2">
  <div class="maincol">
  <div class="filters">
    <input id="q" type="search" placeholder="חיפוש: לקוח, מס' הזמנה, מס' סידורי, דגם" autocomplete="off" aria-label="חיפוש">
    <select id="agentSel" aria-label="סוכן"><option value="">כל הסוכנים</option></select>
  </div>
  <div class="row" id="tabs"></div>
  <div class="list" id="list"><div class="state">טוען הזמנות…</div></div>
  </div>
  <aside class="card side" id="side" hidden aria-live="polite"></aside>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div id="custView" hidden>
  <div class="wrap" style="padding-bottom:0">
    <div class="head"><div><h1 id="custTitle">MTI · אישור סקיצה לג'קוזי</h1><div class="sub" id="custSub"></div></div></div>
    <div class="state" id="custMsg" hidden></div>
  </div>
  <div id="custSketch"></div>
  <div class="wrap" style="padding-top:0"><div class="panel approve" id="custApprove" hidden></div></div>
</div>

<div class="overlay" id="sketchView" hidden></div>
<div id="printArea"></div>

<!-- Firebase SDK from Google's CDN; firebase-config.js holds this project's connection settings. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20261111-094012"></script>
<script src="models.js?v=20261111-094012"></script>
<script src="spa-data.js?v=20261111-094012"></script>
<script src="sketch.js?v=20261111-094012"></script>
<script src="app.js?v=20261111-094012"></script>
</body>
</html>
